name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*'


jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      attestations: write
      id-token: write


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Package Extension
        run: |
          mkdir release

          cp manifest.json release/
          cp background.js release/
          cp content.js release/
          cp popup.html release/
          cp popup.js release/
          cp options.html release/
          cp options.js release/
          cp AppsScript_GoogleSheets_Safe.gs release/

          cd release

          zip -r ../chrome-extension-${{ github.ref_name }}.zip .


      - name: Generate Build Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.zip'


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
